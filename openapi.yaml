openapi: 3.1.0
info:
  title: NioDB API
  summary: NioDB — The Agentic DB that works.
  version: 1.0.1
  description: A lightweight database with natural-language queries, powered by Nio.
    Each Rust server has one workspace; clients do not supply workspace IDs. Nio CLI
    powers chat and read queries. AlaSQL executes restricted SQL. Recovery uses a
    checksummed JSONL journal, derived TOON artifacts and content-addressed file blobs.
    Backend credentials provision app users; users log in with username and password.
    Protected routes accept bearer credentials. Use HTTPS for remote access. Responses
    and errors carry X-Request-ID.
servers:
- url: /
  description: Same origin as the deployed NioDB server
security:
- bearerAuth: []
paths:
  /api/v1/persistence/status:
    get:
      operationId: getPersistenceStatus
      summary: Inspect storage capacity and job progress counters
      description: Backend credentials only. Counts are current server snapshots.
      responses:
        '200':
          description: Current receipt, lease, deletion job and index counters
          content:
            application/json:
              schema:
                type: object
                required: [active_receipts, receipt_limit, receipt_retention_days, spent_keys, active_leases, active_lease_limit, pending_deletion_jobs, indexed_keys]
                properties:
                  active_receipts: {type: integer}
                  receipt_limit: {type: integer}
                  receipt_retention_days: {type: integer}
                  spent_keys: {type: integer}
                  active_leases: {type: integer}
                  active_lease_limit: {type: integer}
                  pending_deletion_jobs: {type: integer}
                  indexed_keys: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/deletion-jobs:
    post:
      operationId: startDeletionJob
      summary: Tombstone and delete a configured reference cascade
      description: >-
        Backend credentials only. A durable child-before-parent plan marks all
        selected records inaccessible in one journal frame; background cleanup
        commits at most 1000 deletions per frame and resumes after restart. Active
        leases, cycles and linked file artifacts prevent job creation. At most
        100000 records and 8 MiB per plan; at most 32 jobs pending. Same key/root
        returns the same job, including after completion. See docs/APPLICATION_STORAGE.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, root_id]
              properties:
                idempotency_key: {type: string, minLength: 1, maxLength: 128}
                root_id: {type: string}
      responses:
        '200':
          description: Durable job state
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: {$ref: '#/components/schemas/DeletionJobStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/deletion-jobs/{id}:
    get:
      operationId: getDeletionJob
      summary: Read exact durable deletion progress
      description: Backend credentials only. Status is pending or complete.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Durable job state
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: {$ref: '#/components/schemas/DeletionJobStatus'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/collections/{collection}/constraints:
    parameters:
    - name: collection
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    get:
      operationId: getCollectionConstraints
      summary: Read an installed application collection policy
      description: Backend credentials only. Returns null when no policy is installed.
      responses:
        '200':
          description: Installed policy or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  constraints:
                    oneOf:
                    - {$ref: '#/components/schemas/CollectionConstraints'}
                    - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: configureCollection
      summary: Install durable application collection constraints
      description: >-
        Backend credentials only. Identical installation is idempotent; replacing a
        policy conflicts. Validates existing data. Target fields must be unique;
        install parent policies first. Unique fields are required strings of at most
        256 bytes. TTL/expiry is prohibited. At most 1000 policies per server.
        Policies survive journal replay and vacuum. See docs/APPLICATION_STORAGE.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionConstraints'}
      responses:
        '200':
          description: Policy installed or already identical
          content:
            application/json:
              schema:
                type: object
                properties:
                  constraints: {$ref: '#/components/schemas/CollectionConstraints'}
        '409':
          description: constraint_conflict, unique_conflict or reference_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/mutations:
    post:
      operationId: mutateAtomically
      summary: Commit a bounded atomic application mutation
      description: >-
        Backend credentials only. Validates the entire final state and active lease
        proofs before one durable journal frame commits. One to 1000 operations,
        at most 1000 proofs, at most 8 MiB each for JSON request and merged result. Updates merge data and require an
        expected revision; deletes require an expected revision. Each existing ID
        may occur once. TTL and deleting storage-linked file records are unsupported.
        References use application keys. Idempotency is scoped by workspace/principal:
        identical ordered operations return the original receipt, including after
        deletion, restart and vacuum. Different operations conflict. Proofs are excluded
        from the fingerprint. Receipt responses are retained for a configurable
        1-365 days (default 30); expired keys remain spent and return mutation_expired.
        Active receipt capacity defaults to 100000 and may be configured to 1000000;
        exhausted capacity returns receipt_limit. Truncated final frames have no
        effect; committed frames replay completely. Legacy bulk behavior is unchanged.
        Use deletion jobs for cascades that exceed one mutation request.
        See docs/APPLICATION_STORAGE.md for recovery and all error codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, operations]
              properties:
                idempotency_key: {type: string, minLength: 1, maxLength: 128}
                operations:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: {$ref: '#/components/schemas/AtomicMutation'}
                leases:
                  type: array
                  maxItems: 1000
                  default: []
                  items: {$ref: '#/components/schemas/LeaseProof'}
      responses:
        '200':
          description: Committed result or original retry receipt
          content:
            application/json:
              schema:
                type: object
                required: [records, deleted]
                properties:
                  records:
                    type: array
                    items: {$ref: '#/components/schemas/MutationArtifact'}
                  deleted:
                    type: array
                    items: {type: string}
        '409':
          description: unique_conflict, reference_conflict, revision_conflict, mutation_conflict, lease_required or lease_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: mutation_too_large or HTTP body limit exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/leases:
    get:
      operationId: getResourceLease
      summary: Inspect shared resource ownership
      description: Backend credentials only. Released resources return null; globally increasing journal fences prevent reuse.
      parameters:
      - name: resource
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Lease or null, and current server-clock activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: {type: boolean}
                  lease:
                    oneOf:
                    - {$ref: '#/components/schemas/ResourceLease'}
                    - {type: 'null'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: changeResourceLease
      summary: Acquire, renew or release fenced resource ownership
      description: >-
        Backend credentials only. Acquire increments the retained counter after expiry
        or release. Same active owner retries return the current lease without extending
        it. Renew requires active ownership and fence. Release requires matching owner
        and fence; repeats are safe. Competing owners and stale fences conflict.
        Server-clock durations are 1000 to 300000 ms. Counters survive restart/vacuum;
        active lease capacity defaults to 100000, configurable to 1000000. Expired
        leases are pruned during acquisition; durable journal sequence numbers
        provide strictly increasing fences after release, expiry, restart or vacuum.
        Guarded writes must use mutation proofs; legacy writes cannot bypass guards. Database fencing does not
        stop external processes; execution bridges must handle lease loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, resource, owner]
              properties:
                action: {type: string, enum: [acquire, renew, release]}
                resource: {type: string, minLength: 1, maxLength: 512}
                owner: {type: string, minLength: 1, maxLength: 128}
                fence: {type: integer, minimum: 1, description: Required for renew and release}
                ttl_ms: {type: integer, minimum: 1000, maximum: 300000, default: 30000}
      responses:
        '200':
          description: Durable ownership result
          content:
            application/json:
              schema:
                type: object
                properties:
                  lease: {$ref: '#/components/schemas/ResourceLease'}
        '409':
          description: lease_conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /guide:
    get:
      operationId: getGuides
      summary: Open NioDB guides
      description: Self-contained documentation for setup, authentication, queries,
        files, chat, events and TypeScript workers. /docs and /docs/ redirect here.
      security: []
      responses:
        '200':
          description: Documentation page
          content:
            text/html:
              schema:
                type: string
  /console:
    get:
      operationId: getConsole
      summary: Open NioDB Web Console Dashboard
      description: Interactive web console to query and manage data, files, events, webhooks, auth users, and server configuration.
      security: []
      responses:
        '200':
          description: Web console dashboard page
          content:
            text/html:
              schema:
                type: string
  /doc:
    get:
      operationId: getDocumentation
      summary: Open interactive API documentation
      description: Swagger UI with Try it out and bearer authorization. Browser internet
        access is needed to load version-pinned CDN assets.
      security: []
      responses:
        '200':
          description: Interactive API documentation page
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      operationId: getHealth
      summary: Check core database readiness
      description: Nio availability does not affect core database readiness.
      security: []
      responses:
        '200':
          description: Core database is ready
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Inspect Nio and AlaSQL readiness
      responses:
        '200':
          description: Current assistance readiness; contains no credentials or paths
          content:
            application/json:
              schema:
                type: object
                required:
                - nio
                - alasql
                properties:
                  nio:
                    type: object
                    required:
                    - status
                    properties:
                      status:
                        type: string
                        enum:
                        - ready
                        - missing
                        - incompatible
                        - unconfigured
                        - unavailable
                      version:
                        type: string
                  alasql:
                    type: object
                    required:
                    - status
                    properties:
                      status:
                        type: string
                        enum:
                        - ready
                        - unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
      description: Startup checks inspect CLI compatibility and configuration; ready
        does not guarantee provider connectivity. Restart after configuration changes.
  /api/v1/records:
    get:
      operationId: listRecords
      summary: List records
      description: Lists records across all collections or one collection, oldest first. Only records visible to the caller are returned. The older /api/v1/artifacts route remains available.
      parameters:
      - name: collection
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Record page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                  next_cursor:
                    type: [string, 'null']
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRecord
      summary: Create a record in a collection
      description: A collection groups similar records and becomes a SQL table when its name is a safe SQL identifier. The collection name 'files' is reserved for file metadata. Idempotency-Key may be supplied for retries.
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [collection, data]
              properties:
                collection:
                  type: string
                  minLength: 1
                  maxLength: 128
                data:
                  type: object
      responses:
        '201':
          description: Record committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/records/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getRecord
      summary: Read a record by ID
    patch:
      operationId: updateRecord
      summary: Update a record by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteRecord
      summary: Delete a record by ID
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/records/bulk:
    post:
      operationId: bulkRecords
      summary: High-throughput bulk record operations (insert, update, delete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Bulk operation summary
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/records/watch:
    get:
      operationId: watchRecords
      summary: Real-time record subscription stream (SSE)
      description: Stream real-time record creations, updates, and deletions filtered by collection and Row-Level Security.
      parameters:
      - name: collection
        in: query
        required: false
        schema:
          type: string
        description: Target collection name to watch
      responses:
        '200':
          description: Server-Sent Events stream of record operations
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /mcp:
    post:
      operationId: mcpHandler
      summary: Model Context Protocol (MCP) JSON-RPC 2.0 endpoint
      description: Native MCP endpoint for AI coding agents (Claude, Cursor, Windsurf) to execute tools, manage memory, and perform vector/SQL queries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                  - type: integer
                  - type: string
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
      responses:
        '200':
          description: MCP JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/artifacts:
    parameters: []
    get:
      operationId: listArtifacts
      summary: List records (legacy artifacts route)
      deprecated: true
      description: Returns records ordered by creation time and ID, oldest first.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        description: Opaque cursor bound to the workspace and filters.
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Artifact page
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Null when no further page is available.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createArtifact
      summary: Create a record (legacy artifacts route)
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - type
              - data
              properties:
                type:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Nonempty, maximum 128 UTF-8 bytes. The type files is
                    reserved for storage metadata.
                data:
                  type: object
                  additionalProperties: true
                  description: Serialized data must fit within 256 KiB; total request
                    body is limited to 300 KiB.
      responses:
        '201':
          description: Artifact committed durably; ID and timestamps assigned by the
            server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional 1–128 ASCII characters, scoped to principal and workspace.
          Repeating identical data returns the original artifact; different data returns
          409.
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/v1/artifacts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      operationId: getArtifact
      summary: Read a record (legacy artifacts route)
      deprecated: true
      responses:
        '200':
          description: Artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Artifact does not exist or is not visible in this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/assist:
    post:
      operationId: assist
      summary: Ask Nio a natural-language question about database data
      description: "Nio can retrieve authorized records, query them, and summarize\
        \ results.\nAmbiguous questions return a clarification request. This operation\
        \ cannot\nmutate records or execute arbitrary shell commands. A conversation\
        \ ID\nmust belong to the caller and the server. References identify\nretrieved\
        \ records; an empty list is allowed for clarification or no results.\n Natural-language\
        \ plans currently support type, literal text search, scalar equality filters,\
        \ ordering by recency and at most 20 records. Joins and aggregates are available\
        \ through the SQL endpoint. Selected skill guidance cannot expand data access\
        \ or enable tools."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Maximum 8192 UTF-8 bytes.
                conversation_id:
                  type: string
                  minLength: 1
                  maxLength: 128
            example:
              message: What did we decide about authentication in this project?
      responses:
        '200':
          description: Nio's answer or clarification question
          content:
            application/json:
              schema:
                type: object
                required:
                - request_id
                - conversation_id
                - status
                - message
                - references
                properties:
                  request_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - answered
                    - needs_clarification
                  message:
                    type: string
                  references:
                    type: array
                    items:
                      type: object
                      required:
                      - record_id
                      - artifact_id
                      - revision
                      properties:
                        record_id:
                          type: string
                        artifact_id:
                          type: string
                          deprecated: true
                        revision:
                          type: integer
                          minimum: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: Nio assistance timed out and execution was cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: Read this API contract
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/skills:
    get:
      operationId: listSkills
      summary: List granted, installed and enabled Nio skills
      description: Catalogs are captured at startup. Host paths and executables are
        not exposed. Small granted SKILL.md files can guide assistance.
      responses:
        '200':
          description: Granted capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - mode
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
                  mode:
                    type: string
                    const: guidance
        default: &id001
          $ref: '#/components/responses/Error'
  /api/v1/plugins:
    get:
      operationId: listPlugins
      summary: List granted, installed and enabled Nio plugins
      description: Catalogs are captured at startup. Host paths and executables are
        not exposed. Discovery only; this endpoint does not execute plugins.
      responses:
        '200':
          description: Granted capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - mode
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
                  mode:
                    type: string
                    const: discovery
        default: *id001
  /api/v1/query:
    post:
      operationId: query
      summary: Execute a restricted read-only AlaSQL SELECT
      description: Only this server’s records are supplied to AlaSQL. Each safe collection
        name becomes a table. The legacy artifacts table contains all visible records. Data keys are flattened; server metadata overrides
        colliding keys. Supports bound scalar parameters, up to two joins, grouping
        and selected aggregates/functions. Arbitrary JavaScript, external files, SQL
        writes and multiple statements are rejected. Default and maximum LIMIT is
        200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - sql
              properties:
                sql:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Maximum 8192 UTF-8 bytes.
                parameters:
                  type: array
                  default: []
                  items:
                    type:
                    - string
                    - number
                    - boolean
                    - 'null'
            example:
              sql: SELECT id, title FROM tasks WHERE status = ? LIMIT 20
              parameters:
              - pending
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - engine
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: true
                  engine:
                    type: string
                    const: alasql
        default: *id001
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Backend creates an app user
      description: Requires a backend server credential. User sessions cannot register
        users. Users share server data, while conversations belong to each user. Passwords
        use salted PBKDF2-HMAC-SHA256 with 600,000 rounds. Password hashes are never
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        default: &id002
          $ref: '#/components/responses/Error'
      tags:
      - Auth
  /auth/register:
    post:
      operationId: registerUserAlias
      summary: Backend creates an app user
      description: Requires a backend server credential. User sessions cannot register
        users. Users share server data, while conversations belong to each user. Passwords
        use salted PBKDF2-HMAC-SHA256 with 600,000 rounds. Password hashes are never
        returned. Alias of /api/v1/auth/register.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Log in with username and password
      security: []
      description: Returns an opaque bearer token valid for seven days. Limited to
        30 login attempts per minute per server and two concurrent password operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
        default: *id002
      tags:
      - Auth
  /auth/login:
    post:
      operationId: loginUserAlias
      summary: Log in with username and password
      security: []
      description: Returns an opaque bearer token valid for seven days. Limited to
        30 login attempts per minute per server and two concurrent password operations.
        Alias of /api/v1/auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Revoke the current user session
      description: Requires a user session. Revocation survives restart. Backend credentials
        cannot use this route.
      responses:
        '204':
          description: Session revoked
        default: *id002
      tags:
      - Auth
  /auth/logout:
    post:
      operationId: logoutUserAlias
      summary: Revoke the current user session
      description: Requires a user session. Revocation survives restart. Backend credentials
        cannot use this route. Alias of /api/v1/auth/logout.
      responses:
        '204':
          description: Session revoked
        default:
          $ref: '#/components/responses/Error'
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the logged-in user
      description: Requires a user session. Password/token hashes are never returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        default: *id002
      tags:
      - Auth
  /auth/me:
    get:
      operationId: getCurrentUserAlias
      summary: Read the logged-in user
      description: Requires a user session. Password/token hashes are never returned.
