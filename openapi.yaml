  /api/v1/auth/users:
    get:
      operationId: listUsers
      tags:
      - Auth
      summary: List registered users
      description: Backend credential only. Returns all registered users in the workspace.
      responses:
        '200':
          description: List of registered users
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /auth/users:
    get:
      operationId: listUsersAlias
      tags:
      - Auth
      summary: List registered users
      description: Alias of /api/v1/auth/users; backend credential only.
      responses:
        '200':
          description: List of registered users
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteUser
      tags:
      - Auth
      summary: Delete a user
      description: Backend credential only. Revokes sessions and removes linked files and chat history. Shared files and general artifacts remain.
      responses:
        '204':
          description: User deleted
        default:
          $ref: '#/components/responses/Error'
  /auth/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteUserAlias
      tags:
      - Auth
      summary: Delete a user
      description: Alias of /api/v1/auth/users/{id}; backend credential only.
      responses:
        '204':
          description: User deleted
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events:
    post:
      operationId: publishEvent
      tags:
      - Events
      summary: Broadcast a live event
      description: Any authenticated caller can broadcast an event to all connected subscribers. Data must fit 16 KiB. The server accepts up to 100 published events per second. Returns before asynchronous workers and webhooks finish. Events have no replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, data]
              properties:
                name:
                  type: string
                  pattern: '^[A-Za-z][A-Za-z0-9._-]{0,63}$'
                data:
                  type: object
      responses:
        '202':
          description: Event broadcast and dispatch scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveEvent'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags:
      - Events
      summary: Subscribe to live events
      description: Authenticated SSE stream. Subscribe to one event with ?name=orders.created; omit name or use '*' for all events. Each message contains a LiveEvent JSON object. A gap event reports missed messages when a subscriber falls behind. Use an Authorization header; replay is not available.
      parameters:
      - name: name
        in: query
        description: Event name to receive, or '*' for every event. Omit for every event.
        schema:
          type: string
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/workers:
    get:
      operationId: listEventWorkers
      tags:
      - Events
      summary: List event workers
      description: Backend credential only. Source is omitted.
      responses:
        '200':
          description: Worker registrations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventWorker'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createEventWorker
      tags:
      - Events
      summary: Register trusted TypeScript event worker
      description: Backend credential only. Trusted administrator code runs in a separate Node 22+ process with server privileges. Source is journaled privately. It must export a default function receiving one LiveEvent. Five-second limit, 64 MiB Node heap and two concurrent executions. Event publishing does not await it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_name, source]
              properties:
                event_name:
                  type: string
                  description: Exact event name or '*'.
                source:
                  type: string
                  maxLength: 32768
      responses:
        '201':
          description: Worker registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWorker'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/events/workers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getEventWorker
      tags: [Events]
      summary: Get event worker details and source
      description: Backend credential only.
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EventWorker'
                - type: object
                  required: [source]
                  properties:
                    source:
                      type: string
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEventWorker
      tags: [Events]
      summary: Update an event worker's event name or source
      description: Backend credential only. Updates preserve the worker ID and creation metadata. The updated source is used for subsequent events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                event_name:
                  type: string
                  description: Exact event name or '*'.
                source:
                  type: string
                  minLength: 1
                  maxLength: 32768
      responses:
        '200':
          description: Updated worker details including source
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EventWorker'
                - type: object
                  required: [source]
                  properties:
                    source:
                      type: string
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteEventWorker
      tags:
      - Events
      summary: Remove event worker
      description: Backend credential only.
      responses:
        '204':
          description: Worker removed
        default:
          $ref: '#/components/responses/Error'
  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags:
      - Webhooks
      summary: List webhooks
      description: Backend credential only. Signing secrets are omitted.
      responses:
        '200':
          description: Webhook registrations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createWebhook
      tags:
      - Webhooks
      summary: Register webhook
      description: Backend credential only. HTTPS URL required; HTTP loopback is allowed. Creation returns the signing secret once. Delivery uses three attempts while the server runs, a five-second timeout and no redirects. The X-NioDB-Signature header is sha256=<hex HMAC-SHA256> of the exact JSON body keyed by the returned secret string. Delivery is not durable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_name, url]
              properties:
                event_name:
                  type: string
                  description: Exact event name or '*'.
                url:
                  type: string
                  format: uri
                  maxLength: 2048
      responses:
        '201':
          description: Webhook registered; save secret now
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Webhook'
                - type: object
                  required: [secret]
                  properties:
                    secret:
                      type: string
                      writeOnly: true
        default:
          $ref: '#/components/responses/Error'
  /api/v1/webhooks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteWebhook
      tags:
      - Webhooks
      summary: Remove webhook
      description: Backend credential only.
      responses:
        '204':
          description: Webhook removed
        default:
          $ref: '#/components/responses/Error'
  /chat:
    post:
      operationId: chat
      tags:
      - Chat
      summary: Chat with Nio using app fields and database queries
      description: Ordinary conversation, general knowledge and read-only retrieval.
        Fields and queries are optional. Nio can also plan retrieval automatically.
        Conversation IDs belong to the caller. References are validated against supplied
        records. File metadata is queryable as type files; bytes are not read or sent
        automatically. No tool execution or agent mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Nio's answer or clarification question
          content:
            application/json:
              schema:
                type: object
                required:
                - request_id
                - conversation_id
                - status
                - message
                - references
                properties:
                  request_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - answered
                    - needs_clarification
                  message:
                    type: string
                  references:
                    type: array
                    items:
                      type: object
                      required:
                      - record_id
                      - artifact_id
                      - revision
                      properties:
                        record_id:
                          type: string
                        artifact_id:
                          type: string
                          deprecated: true
                        revision:
                          type: integer
                          minimum: 1
        default: *id002
  /api/v1/chat:
    post:
      operationId: chatVersioned
      tags:
      - Chat
      summary: Chat with Nio using app fields and database queries
      description: Ordinary conversation, general knowledge and read-only retrieval.
        Fields and queries are optional. Nio can also plan retrieval automatically.
        Conversation IDs belong to the caller. References are validated against supplied
        records. File metadata is queryable as type files; bytes are not read or sent
        automatically. No tool execution or agent mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Nio's answer or clarification question
          content:
            application/json:
              schema:
                type: object
                required:
                - request_id
                - conversation_id
                - status
                - message
                - references
                properties:
                  request_id:
                    type: string
                  conversation_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - answered
                    - needs_clarification
                  message:
                    type: string
                  references:
                    type: array
                    items:
                      type: object
                      required:
                      - record_id
                      - artifact_id
                      - revision
                      properties:
                        record_id:
                          type: string
                        artifact_id:
                          type: string
                          deprecated: true
                        revision:
                          type: integer
                          minimum: 1
        default: *id002
  /api/v1/storage:
    get:
      operationId: listBuckets
      tags:
      - Files
      summary: List buckets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bucket'
        default: *id002
    post:
      operationId: createBucket
      tags:
      - Files
      summary: Create a bucket
      description: Existing buckets are returned unchanged. Uploading also creates
        a bucket automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9_-]+$
                  description: Lowercase ASCII name. Reserved filesystem device names
                    such as con, prn, aux, nul, com1 and lpt1 are rejected.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        default: *id002
  /api/v1/storage/{bucket}:
    parameters:
    - &id003
      name: bucket
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9_-]{1,63}$
    get:
      operationId: listFiles
      tags:
      - Files
      summary: List bucket files
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        description: File ID returned as next_cursor, bound to this bucket.
        schema: &id004
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        default: *id002
  /api/v1/storage/{bucket}/upload:
    parameters:
    - *id003
    post:
      operationId: uploadFile
      tags:
      - Files
      summary: Stream one file into a bucket
      description: Up to 16 MiB per file, 60 seconds per upload, four concurrent uploads.
        Current logical quota is 128 MiB of file references per server. Identical
        bytes share a blob within a bucket. Multipart requests contain exactly one
        field named file. Raw requests require filename in the query. Filenames are
        metadata, never host paths. The maximum metadata count is 10,000 files.
      parameters:
      - name: filename
        in: query
        description: Required for raw uploads. Multipart uses the file field filename.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - name: user_id
        in: query
        description: Optional owner user ID. If absent, every authenticated caller can access the file. User sessions may use only their own ID; backend credentials may use any existing user ID. Linked files are visible only to the owner's session, including through artifacts, SQL and Nio.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default: *id002
  /api/v1/storage/{bucket}/{id}:
    parameters:
    - *id003
    - &id005
      name: id
      in: path
      required: true
      schema: *id004
    get:
      operationId: downloadFile
      tags:
      - Files
      summary: Stream a file download
      description: Served as attachments. Supports one bytes Range, including suffix
        ranges. Multiple or unsatisfiable ranges return 416. If-Range supports the
        strong ETag; mismatch returns the complete file.
      parameters:
      - name: Range
        in: header
        schema: *id004
      - name: If-Range
        in: header
        schema: *id004
      responses:
        '200':
          description: Complete file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial file; Content-Range identifies the bytes returned
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '416': *id002
        default: *id002
    delete:
      operationId: deleteFile
      tags:
      - Files
      summary: Delete a file and its metadata
      description: Blob bytes are removed once no file in the bucket references them.
        Its query/chat metadata artifact is removed as well.
      responses:
        '204':
          description: File deleted
        default: *id002
  /api/v1/storage/{bucket}/{id}/metadata:
    parameters:
    - *id003
    - *id005
    get:
      operationId: getFileMetadata
      tags:
      - Files
      summary: Read file metadata
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default: *id002
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer credential supporting combined client-token:secret-token (or individual client/secret tokens, both with full backend access), or expiring app-user session. Keep backend credentials off public web/mobile clients. Registration requires a backend credential; me/logout require a user session.
  parameters: {}
  schemas:
    DeletionJobStatus:
      type: object
      required: [id, root_id, status, deleted, total, created_at_ms]
      properties:
        id: {type: string}
        root_id: {type: string}
        status: {type: string, enum: [pending, complete]}
        deleted: {type: integer}
        total: {type: integer}
        created_at_ms: {type: integer}
    CollectionConstraints:
      type: object
      additionalProperties: false
      properties:
        unique:
          type: array
          maxItems: 16
          uniqueItems: true
          default: []
          items: {type: string, minLength: 1, maxLength: 128}
        references:
          type: array
          maxItems: 16
          default: []
          items:
            type: object
            additionalProperties: false
            required: [field, collection, target_field]
            properties:
              field: {type: string, minLength: 1, maxLength: 128}
              collection: {type: string, minLength: 1, maxLength: 128}
              target_field: {type: string, minLength: 1, maxLength: 128}
        lease:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [field, prefix]
            properties:
              field: {type: string, minLength: 1, maxLength: 128}
              prefix: {type: string, minLength: 1, maxLength: 128}
    LeaseProof:
      type: object
      additionalProperties: false
      required: [resource, owner, fence]
      properties:
        resource: {type: string, minLength: 1, maxLength: 512}
        owner: {type: string, minLength: 1, maxLength: 128}
        fence: {type: integer, minimum: 1}
    ResourceLease:
      type: object
      required: [resource, owner, fence, expires_at]
      properties:
        resource: {type: string}
        owner: {type: string}
        fence: {type: integer, minimum: 1}
        expires_at: {type: integer, description: Server UTC epoch milliseconds; zero means released}
    AtomicMutation:
      oneOf:
      - type: object
        additionalProperties: false
        required: [action, collection, data]
        properties:
          action: {const: create}
          collection: {type: string, minLength: 1, maxLength: 128}
          data: {type: object, additionalProperties: true}
      - type: object
        additionalProperties: false
        required: [action, id, data, expected_revision]
        properties:
          action: {const: update}
          id: {type: string}
          data: {type: object, additionalProperties: true}
          expected_revision: {type: integer, minimum: 1}
      - type: object
        additionalProperties: false
        required: [action, id, expected_revision]
        properties:
          action: {const: delete}
          id: {type: string}
          expected_revision: {type: integer, minimum: 1}
    MutationArtifact:
      type: object
      required: [id, workspace_id, kind, data, revision, created_at, updated_at]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        kind: {type: string}
        data: {type: object, additionalProperties: true}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Record:
      type: object
      required: [id, collection, data, revision, created_at, updated_at]
      properties:
        id:
          type: string
        collection:
          type: string
        data:
          type: object
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Artifact:
      type: object
      required:
      - id
      - type
      - data
      - revision
      - created_at
      - updated_at
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      - request_id
      properties:
        request_id:
          type: string
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - nio_unavailable
              - invalid_request
            message:
              type: string
    Capability:
      type: object
      required:
      - name
      - description
      - enabled
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          const: true
    Credentials:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9_.-]+$
          description: Trimmed and normalized to lowercase.
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
          description: Registration requires 12–1024 UTF-8 bytes.
    User:
      type: object
      required:
      - id
      - username
      - created_at
      properties:
        id: *id004
        username: *id004
        created_at:
          type: string
          format: date-time
    Login:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - expires_at
      - user
      properties:
        access_token: *id004
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 604800
        expires_at:
          type: integer
          description: Unix timestamp in seconds.
        user:
          $ref: '#/components/schemas/User'
    ChatQuery:
      type: object
      additionalProperties: false
      required:
      - sql
      properties:
        sql:
          type: string
          maxLength: 8192
        parameters:
          type: array
          default: []
          items:
            type:
            - string
            - number
            - boolean
            - 'null'
    ChatRequest:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8192
          description: Maximum 8192 UTF-8 bytes.
        conversation_id:
          type: string
          maxLength: 128
        fields:
          type: object
          additionalProperties: true
          description: Untrusted app context; maximum 4 KiB after safe JSON encoding.
        queries:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ChatQuery'
          description: Restricted read-only SQL executed before chatting; combined
            results must fit 8 KiB.
    Bucket:
      type: object
      required:
      - name
      - created_at
      - created_by
      properties:
        name: *id004
        created_at:
          type: string
          format: date-time
        created_by: *id004
    File:
      type: object
      required:
      - id
      - record_id
      - artifact_id
      - bucket
      - filename
      - sha256
      - size
      - mime
      - created_at
      - created_by
      properties:
        id: *id004
        record_id: *id004
        artifact_id: *id004
        bucket: *id004
        filename: *id004
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size:
          type: integer
          minimum: 0
          maximum: 16777216
        mime: *id004
        created_at:
          type: string
          format: date-time
        created_by: *id004
        user_id:
          type: string
          description: Present only for owner-linked files.
    LiveEvent:
      type: object
      required: [id, name, data, actor, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        actor:
          type: string
        created_at:
          type: string
          format: date-time
    EventWorker:
      type: object
      required: [id, event_name, created_at, created_by]
      properties:
        id:
          type: string
        event_name:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
    Webhook:
      type: object
      required: [id, event_name, url, created_at, created_by]
      properties:
        id:
          type: string
        event_name:
          type: string
        url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
  responses:
    Error:
      description: 'Request failed; no credentials, raw CLI output or internal paths.
        Common statuses: 400 invalid request/query, 401 authentication, 403 workspace
        denial, 404 missing record, 409 idempotency/conversation conflict, 413 size
        limit, 422 malformed body, 429 capacity exhausted, 502 invalid Nio output,
        503 dependency/storage unavailable, 504 timeout.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Bearer credential is missing, invalid or expired. Backend credentials
        have no automatic expiry; app-user sessions expire after seven days. WWW-Authenticate:
        Bearer is returned.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller lacks access to this data or operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Required database, Nio, or AlaSQL service is unavailable; code
        identifies the component.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
tags:
- name: Auth
  description: Backend-managed username/password users and sessions.
- name: Files
  description: Bucket-based streaming file storage with optional user ownership.
- name: Events
  description: Authenticated live event broadcast and trusted backend event workers.
- name: Webhooks
  description: Backend-managed outgoing event notifications.
- name: Chat
  description: Nio conversation with app context and database queries.
