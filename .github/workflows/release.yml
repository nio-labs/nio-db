name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            pkg_platform: linux
            pkg_arch: x64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            pkg_platform: linux
            pkg_arch: arm64
          - os: macos-15
            target: darwin-aarch64
            pkg_platform: darwin
            pkg_arch: arm64
          - os: macos-15
            target: darwin-x86_64
            pkg_platform: darwin
            pkg_arch: x64
          - os: windows-latest
            target: windows-x86_64
            pkg_platform: win32
            pkg_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Require npm publishing token
        run: test -n "$NODE_AUTH_TOKEN"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            rustup target add x86_64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
          else
            cargo build --release --locked
          fi
      - name: Package platform npm package
        run: |
          BIN_PATH="target/release/niodb"
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            BIN_PATH="target/x86_64-apple-darwin/release/niodb"
          elif [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            BIN_PATH="target/release/niodb.exe"
          fi
          node scripts/package-platform.cjs "$BIN_PATH" "${{ matrix.pkg_platform }}" "${{ matrix.pkg_arch }}"
          EXT=""
          if [ "${{ matrix.pkg_platform }}" = "win32" ]; then
            EXT=".exe"
          fi
          cp "$BIN_PATH" "dist/niodb-${{ matrix.pkg_platform }}-${{ matrix.pkg_arch }}$EXT"
      - name: Upload binary asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/niodb-${{ matrix.pkg_platform }}-${{ matrix.pkg_arch }}*
      - name: Publish platform package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "dist/nio-db-${{ matrix.pkg_platform }}-${{ matrix.pkg_arch }}"
          npm publish --access public

  publish-npm:
    name: publish npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Require npm publishing token
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Publish @nio-labs/nio-db.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/nio-db.js
          npm publish --access public
      - name: Publish @nio-labs/nio-db
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  publish-pypi:
    name: publish python package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist and wheel
        run: |
          cd packages/nio-db-py
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/nio-db-py/dist/
          skip-existing: true
          verbose: true
