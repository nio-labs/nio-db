[package]
name = "niodb"
version = "1.0.2"
edition = "2024"
rust-version = "1.89"
description = "Standalone file-based database server with Nio CLI assistance"
license = "MIT"
publish = false

[features]
sqlite-benchmark = ["dep:rusqlite"]

[[bin]]
name = "sqlite-benchmark"
path = "src/bin/sqlite-benchmark.rs"
required-features = ["sqlite-benchmark"]

[dependencies]
axum = { version = "0.7.9", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.11", default-features = false }
subtle = "2.6"
mime = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "io-util", "time", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32.1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
